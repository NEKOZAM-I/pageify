<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Pageify</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }

    .notfound-icon {
      font-size: 2.6rem;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin: 0 0 0.5rem;
    }

    p {
      color: var(--muted);
      margin: 0 0 1.6rem;
    }

    .notfound-home-btn {
      display: inline-block;
      background: var(--accent);
      color: #0E1117;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.7rem 1.4rem;
      border-radius: 0.6rem;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div>
    <div class="notfound-icon"><i class="fa-solid fa-compass"></i></div>
    <h1>Oops! Page not found</h1>
    <p>The page you're looking for doesn't exist, or hasn't been published yet.</p>
    <a href="{{ url_for('home') }}" class="notfound-home-btn">Back to Pageify</a>
  </div>
</body>

</html>
